<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주식 프리즘 — 같은 데이터, 세 가지 시선</title>
<link rel="icon" href="posts/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="posts/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="posts/favicon-16.png">
<link rel="apple-touch-icon" href="posts/apple-touch-icon.png">
<link rel="canonical" href="https://stockprism.xyz/">
<script id="sp-theme">
(function(){
  var KEY='sp-theme';
  var st=document.createElement('style');
  st.textContent=
    'html.sp-dark,html.sp-dark body{background:#0d1117 !important;}'+
    'html.sp-dark body>*:not(#sp-theme-btn){filter:invert(0.93) hue-rotate(180deg);}'+
    'html.sp-dark body>*:not(#sp-theme-btn) img{filter:invert(1) hue-rotate(180deg);}'+
    '#sp-theme-btn{position:fixed;right:16px;bottom:16px;z-index:9999;width:44px;height:44px;border-radius:50%;border:1px solid #d1d5db;background:#ffffff;font-size:20px;line-height:1;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.18);padding:0;}'+
    'html.sp-dark #sp-theme-btn{background:#1f2937;border-color:#4b5563;}';
  document.head.appendChild(st);
  function saved(){try{return localStorage.getItem(KEY);}catch(e){return null;}}
  var pref=saved();
  var dark=pref?pref==='dark':!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  var btn=null;
  function apply(){document.documentElement.classList.toggle('sp-dark',dark);if(btn)btn.textContent=dark?'☀️':'🌙';}
  apply();
  function makeBtn(){
    btn=document.createElement('button');
    btn.id='sp-theme-btn';
    btn.setAttribute('aria-label','다크모드 전환');
    btn.onclick=function(){dark=!dark;try{localStorage.setItem(KEY,dark?'dark':'light');}catch(e){}apply();};
    document.body.appendChild(btn);
    apply();
  }
  if(document.body){makeBtn();}else{document.addEventListener('DOMContentLoaded',makeBtn);}
})();
</script>
</head>
<body style="margin:0; padding:0; background:#ffffff; font-family:'Apple SD Gothic Neo','Malgun Gothic','Noto Sans KR',sans-serif; color:#1f2937; line-height:1.8;">

<div style="max-width:800px; margin:0 auto; padding:24px 16px;">

  <!-- ═══════════ 사이트 공통: 상단 브랜드 바 (상세 페이지와 동일 높이) ═══════════ -->
  <nav style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #e5e7eb; padding-bottom:12px; margin-bottom:20px;">
    <a href="index.html" style="text-decoration:none; font-size:13px; letter-spacing:1px; color:#6b7280; font-weight:700;"><img src="posts/logo-mark.png" alt="STOCK PRISM" style="height:1.8em; vertical-align:middle; margin-right:6px;"><span style="position:relative; top:0.13em;">STOCK PRISM</span></a>
  </nav>

  <!-- ═══════════ 헤더 ═══════════ -->
  <header style="border-bottom:2px solid #111827; padding-bottom:20px; margin-bottom:24px;">
    <h1 style="margin:0 0 10px 0; font-size:30px; line-height:1.4;">주식 프리즘 <span style="font-size:15px; font-weight:400; color:#374151; margin-left:6px;">같은 데이터, 세 가지 시선.</span></h1>
    <p style="margin:0; font-size:15px; color:#374151;">한 종목을 재무·뉴스·업종 세 갈래로 분석하고, 공격적·중립적·보수적 세 관점의 필진이 각자 결론을 내립니다.</p>
  </header>

  <!-- ═══════════ 검색 ═══════════ -->
  <div style="position:relative; margin-bottom:4px;">
    <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-size:14px; color:#9ca3af; pointer-events:none;">🔍</span>
    <input id="search-input" type="search" placeholder="종목명 또는 날짜로 검색 (예: 삼성전자, 2026-08)" autocomplete="off"
      style="width:100%; box-sizing:border-box; padding:11px 14px 11px 38px; font-size:14px; color:#1f2937; background:#f9fafb; border:1px solid #e5e7eb; border-radius:10px; outline:none; font-family:inherit;"
      onfocus="this.style.borderColor='#111827'; this.style.background='#ffffff';"
      onblur="this.style.borderColor='#e5e7eb'; this.style.background='#f9fafb';">
  </div>

  <!-- ═══════════ 포스트 목록 ═══════════ -->
  <div id="post-list">
    <p id="loading-msg" style="font-size:14px; color:#6b7280; text-align:center; padding:40px 0;">포스트 목록을 불러오는 중입니다…</p>
  </div>

  <!-- ═══════════ 면책고지 ═══════════ -->
  <footer style="margin-top:40px; border-top:1px solid #e5e7eb; padding-top:20px;">
    <p style="font-size:12px; color:#9ca3af; margin:0;">본 블로그의 모든 글은 정보 제공을 목적으로 하며, 특정 종목의 매수·매도를 권유하는 것이 아닙니다. 투자의 최종 판단과 책임은 투자자 본인에게 있습니다.</p>
    <p style="font-size:12px; margin:8px 0 0 0;"><a href="about.html" style="color:#6b7280; text-decoration:none;">소개</a> · <a href="privacy.html" style="color:#6b7280; text-decoration:none;">개인정보처리방침</a></p>
      <div style="margin-top:10px; font-size:12px; color:#6b7280;"><span style="font-weight:700; letter-spacing:1px;"><img src="posts/logo-mark.png" alt="STOCK PRISM" style="height:1.8em; vertical-align:middle; margin-right:6px;"><span style="position:relative; top:0.13em;">STOCK PRISM</span></span><span style="position:relative; top:0.13em;"> · 같은 데이터, 세 가지 시선</span></div>
  </footer>

</div>

<script>
(function () {
  var API_URL = 'https://api.github.com/repos/seil77/stock-prism/contents/posts';
  var PERSPECTIVES = {
    '공격적': { color: '#dc2626', desc: '성장 가능성에 무게' },
    '중립적': { color: '#4b5563', desc: '양쪽 근거를 저울에' },
    '보수적': { color: '#2563eb', desc: '리스크 관리 우선' }
  };
  var ORDER = ['공격적', '중립적', '보수적'];

  // 같은 날짜 안에서 종목을 나열하는 순서 = 코스피 시가총액 순위.
  // 이 배열은 예약 작업 stock-blog-daily-post 의 0.5단계에서
  // scripts/sync_marketcap_order.py 가 자동 갱신한다 — 손으로 고치지 말 것.
  // 여기 없는 종목은 뒤에 가나다순으로 붙는다.
  // (2026-08-10 KRX 장마감 기준)
  var MARKET_CAP_ORDER = [
    '삼성전자', 'SK하이닉스', 'SK스퀘어', '삼성전기', 'LG에너지솔루션',
    '현대차', '삼성바이오로직스', 'KB금융', '한화에어로스페이스', '삼성생명',
    'HD현대중공업', '삼성물산', '기아', '두산에너빌리티', '신한지주',
    '셀트리온', '현대모비스', '삼성SDI', 'SK', '하나금융지주',
    'NAVER', 'LS ELECTRIC', 'LG전자', '한화오션', 'HD한국조선해양',
    '삼성화재', 'HD현대일렉트릭', '효성중공업', 'POSCO홀딩스', '고려아연'
  ];

  var allGroups = null; // render()에서 채워지는 정렬된 그룹 배열 (검색 필터의 원본)

  function capRank(stock) {
    var i = MARKET_CAP_ORDER.indexOf(stock);
    return i === -1 ? MARKET_CAP_ORDER.length : i;
  }

  function fmtDate(yyyymmdd) {
    return yyyymmdd.slice(0, 4) + '-' + yyyymmdd.slice(4, 6) + '-' + yyyymmdd.slice(6, 8);
  }

  function norm(s) {
    return s.replace(/\s+/g, '').toLowerCase();
  }

  function render(files) {
    // 파일명 규칙: YYYYMMDD_종목명_관점.html
    var groups = {}; // key: date_stock
    files.forEach(function (f) {
      var m = /^(\d{8})_(.+)_(공격적|중립적|보수적)\.html$/.exec(f.name);
      if (!m) return;
      var key = m[1] + '_' + m[2];
      if (!groups[key]) groups[key] = { date: m[1], stock: m[2], views: {} };
      groups[key].views[m[3]] = 'posts/' + encodeURIComponent(f.name);
    });

    // 최신 날짜 먼저, 같은 날짜 안에서는 시가총액 순위 순서
    var keys = Object.keys(groups).sort(function (a, b) {
      var ga = groups[a], gb = groups[b];
      if (ga.date !== gb.date) return ga.date < gb.date ? 1 : -1;
      var ra = capRank(ga.stock), rb = capRank(gb.stock);
      if (ra !== rb) return ra - rb;
      return ga.stock.localeCompare(gb.stock, 'ko');
    });

    allGroups = keys.map(function (k) { return groups[k]; });

    // 상세 페이지에 다녀와도 검색어가 유지되도록 sessionStorage에 저장·복원
    var input = document.getElementById('search-input');
    var saved = '';
    try { saved = sessionStorage.getItem('sp-search') || ''; } catch (e) {}
    if (saved) input.value = saved;
    draw(saved);

    function onSearch() {
      try { sessionStorage.setItem('sp-search', input.value); } catch (e) {}
      draw(input.value);
    }
    input.addEventListener('input', onSearch);
    input.addEventListener('search', onSearch); // type=search의 ✕ 버튼 대응
  }

  function draw(query) {
    var container = document.getElementById('post-list');

    if (allGroups.length === 0) {
      container.innerHTML = '<p style="font-size:14px; color:#6b7280; text-align:center; padding:40px 0;">아직 게시된 포스트가 없습니다.</p>';
      return;
    }

    var q = norm(query);
    var list = !q ? allGroups : allGroups.filter(function (g) {
      return norm(g.stock).indexOf(q) !== -1 ||
             g.date.indexOf(q) !== -1 ||
             fmtDate(g.date).indexOf(q) !== -1;
    });

    if (list.length === 0) {
      container.innerHTML = '<p style="font-size:14px; color:#6b7280; text-align:center; padding:40px 0;">검색 결과가 없습니다.</p>';
      return;
    }

    var html = '';
    var lastDate = '';
    list.forEach(function (g) {
      if (g.date !== lastDate) {
        lastDate = g.date;
        html += '<h2 style="font-size:15px; color:#6b7280; font-weight:700; letter-spacing:0.5px; margin:28px 0 12px 0;">' + fmtDate(g.date) + '</h2>';
      }
      html += '<div style="background:#f9fafb; border:1px solid #e5e7eb; border-radius:12px; padding:20px 24px; margin-bottom:14px;">';
      html += '<div style="display:flex; align-items:baseline; gap:10px; margin-bottom:14px;">';
      html += '<span style="font-size:20px; font-weight:800; color:#111827;">' + g.stock + '</span>';
      html += '<span style="font-size:13px; color:#6b7280;">세 가지 관점으로 읽기</span>';
      html += '</div>';
      html += '<div style="display:flex; gap:10px; flex-wrap:wrap;">';
      ORDER.forEach(function (p) {
        if (!g.views[p]) return;
        var conf = PERSPECTIVES[p];
        html += '<a href="' + g.views[p] + '" style="flex:1; min-width:140px; text-decoration:none; text-align:center; padding:12px 16px; border-radius:10px; background:#ffffff; border:1.5px solid ' + conf.color + ';">';
        html += '<div style="font-size:15px; font-weight:800; color:' + conf.color + ';">' + p + ' 관점</div>';
        html += '<div style="font-size:12px; color:#6b7280; margin-top:3px;">' + conf.desc + '</div>';
        html += '</a>';
      });
      html += '</div></div>';
    });
    container.innerHTML = html;
  }

  function fail() {
    document.getElementById('post-list').innerHTML =
      '<p style="font-size:14px; color:#6b7280; text-align:center; padding:40px 0;">목록을 불러오지 못했습니다. 잠시 후 새로고침해 주시거나, <a href="https://github.com/seil77/stock-prism/tree/main/posts" style="color:#2563eb;">GitHub에서 직접 보기</a>를 이용해 주세요.</p>';
  }

  fetch(API_URL)
    .then(function (res) { if (!res.ok) throw new Error(res.status); return res.json(); })
    .then(function (data) { if (!Array.isArray(data)) throw new Error('bad'); render(data); })
    .catch(fail);
})();
</script>

</body>
</html>
